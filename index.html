<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>월급루팡</title>
    <style>
        /* --- 기본 리셋 및 변수 --- */
        :root {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-main: #ffffff;
            --accent: #4caf50; --danger: #f44336; --bottom-bar: #000000;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Pretendard', -apple-system, sans-serif;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            user-select: none; transition: background-color 0.3s, color 0.3s;
        }

        /* --- 상단/본문/하단 레이아웃 (몰입모드 애니메이션 적용) --- */
        .app-header {
            text-align: center; padding: 15px; font-weight: bold; font-size: 1.1rem;
            background: var(--bg-color); border-bottom: 1px solid #333;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 10;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: var(--bottom-bar); display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #333; padding-bottom: env(safe-area-inset-bottom);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 10;
        }
        /* 몰입 모드 (UI 숨김) 클래스 */
        body.ui-hidden .app-header { transform: translateY(-100%); }
        body.ui-hidden .bottom-nav { transform: translateY(100%); }

        .content-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 80px; position: relative; }
        .tab-content { display: none; animation: fadeIn 0.3s; height: 100%; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .nav-item { flex: 1; text-align: center; color: #888; font-size: 0.8rem; cursor: pointer; padding: 10px 0; transition: color 0.2s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }

        /* --- 메인 UI 요소 --- */
        .money-display { font-size: 3rem; font-weight: bold; text-align: center; margin: 30px 0; color: inherit; letter-spacing: -1px; }
        .info-box { background: var(--panel-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; line-height: 1.6; font-size: 0.9rem; }
        .progress-container { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; }
        
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: none; background: #333; color: white; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 10px; }
        .btn-green { background: var(--accent); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn-gray { background: #555; color: white; }
        .flex-row { display: flex; gap: 10px; }

        /* --- 토스트 & 업적 --- */
        .toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 1px solid #ffd700; color: white;
            padding: 12px 20px; border-radius: 30px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: top 0.4s; z-index: 1000; font-size: 0.9rem;
        }
        .toast.show { top: 20px; }
        .achievements-grid { display: grid; gap: 10px; }
        .achievement-card { background: var(--panel-bg); padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 12px; opacity: 0.4; filter: grayscale(100%); }
        .achievement-card.unlocked { opacity: 1; filter: grayscale(0%); border-left: 4px solid #ffd700; }

        /* =========================================
           테마 1: 다크 모드 (기본)
        ========================================= */
        /* 기본값이 다크모드 설정 */

        /* =========================================
           테마 2: 아기자기 모드
        ========================================= */
        body.theme-cute { background-color: #fff0f5; color: #555; font-family: 'Comic Sans MS', sans-serif; --panel-bg: #ffffff; --bottom-bar: #ffffff; --accent: #ff69b4; }
        body.theme-cute .app-header { background: #fff0f5; border-bottom: 2px dashed #ffb6c1; color: #ff1493; }
        body.theme-cute .bottom-nav { border-top: 2px solid #ffe4e1; box-shadow: 0 -2px 10px rgba(255,182,193,0.2); }
        body.theme-cute .money-display { color: #ff1493; text-shadow: 1px 1px 2px rgba(255,182,193,0.5); }
        body.theme-cute .info-box { border: 2px dashed #ffb6c1; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        body.theme-cute .progress-container { background: #ffe4e1; height: 10px; border-radius: 5px; }
        body.theme-cute input { background: #fff; border: 2px solid #ffb6c1; color: #333; }
        body.theme-cute .nav-item { color: #ffb6c1; }
        body.theme-cute .nav-item.active { color: #ff1493; }

        /* =========================================
           테마 3: 위장(엑셀) 모드
        ========================================= */
        body.theme-disguise { background-color: #ffffff; color: #000; font-family: 'Malgun Gothic', '맑은 고딕', monospace; --panel-bg: #fff; --bottom-bar: #f3f2f1; --accent: #217346; }
        body.theme-disguise .app-header { text-align: left; background: #217346; color: white; border: none; font-size: 0.9rem; padding: 10px; font-weight: normal; }
        body.theme-disguise .money-display { font-size: 1.5rem; text-align: right; padding: 10px; border: 1px solid #ccc; background: #fff; margin: 10px 0; font-weight: normal; }
        body.theme-disguise .info-box { border: 1px solid #ccc; border-radius: 0; margin-bottom: 5px; font-size: 0.8rem; }
        body.theme-disguise .progress-container { height: 2px; border-radius: 0; background: #eee; }
        body.theme-disguise .emoji { display: none; }
        
        /* 엑셀 시트 탭 모양으로 하단 네비게이션 변경 */
        body.theme-disguise .bottom-nav { justify-content: flex-start; gap: 2px; padding: 0 10px; height: 40px; }
        body.theme-disguise .nav-item { flex: none; padding: 5px 15px; margin-top: 10px; background: #e1e1e1; border: 1px solid #ccc; border-bottom: none; border-radius: 4px 4px 0 0; font-size: 0.8rem; color: #555; }
        body.theme-disguise .nav-item.active { background: #fff; color: #217346; font-weight: bold; border-bottom: 1px solid #fff; margin-bottom: -1px; }
        body.theme-disguise .nav-icon { display: none; /* 아이콘 숨김 */ }
    </style>
</head>
<body id="body">

<div class="app-header" id="header"><span class="emoji">💸</span> 루팡 페이</div>
<div id="toast" class="toast"><span class="emoji">🏆</span> <span id="toast-msg">업적 달성!</span></div>

<div class="content-area" id="content-area">
    
    <!-- 1. 메인 탭 (초깔끔 모드) -->
    <!-- 클릭 시 UI(헤더/하단바) 토글 -->
    <div id="tab-main" class="tab-content active" onclick="toggleUI()">
        <p style="text-align:center; font-size:0.75rem; color:#888; margin-top:0;" class="emoji">👆 화면을 탭하면 전체화면이 됩니다</p>
        
        <!-- 오직 돈! 소수점 2자리 복구 -->
        <div id="label_money" class="money-display">0.00</div>
        <div class="progress-container"><div id="progress_bar" class="progress-bar"></div></div>
        
        <div class="info-box">
            <span class="emoji">⏱️</span> <b class="disguise-text">근무 시간 환산 데이터</b><br>
            <span id="label_salary_info" style="color:gray;">초당: 0.00원 | 일당: 0원</span><br>
            <span id="label_dday" style="color:var(--accent); font-weight:bold;">목표 계산 중...</span>
        </div>

        <div class="info-box" id="label_items">
            <!-- 아이템 리스트 -->
        </div>
    </div>

    <!-- 2. 업적 탭 -->
    <div id="tab-achievements" class="tab-content">
        <h3 style="margin-top:0;">나의 루팡 업적 (<span id="ach-count">0</span>/30)</h3>
        <div class="achievements-grid" id="achievements-list"></div>
    </div>

    <!-- 3. 설정 탭 (모든 입력/설정 기능 통합) -->
    <div id="tab-settings" class="tab-content">
        <h3>수동 입/출금</h3>
        <div class="info-box">
            <input type="number" id="input_extra" placeholder="금액 입력 (원)">
            <div class="flex-row">
                <button class="btn-green" onclick="addMoney()">+ 비자금 입금</button>
                <button class="btn-red" onclick="spendMoney()">- 탕진 (지출)</button>
            </div>
        </div>

        <h3>목표 및 급여 설정</h3>
        <div class="info-box">
            <label style="font-size:0.8rem; color:#888;">실수령 월급</label>
            <input type="number" id="input_salary" placeholder="예: 2500000">
            <label style="font-size:0.8rem; color:#888;">나만의 목표 금액</label>
            <input type="number" id="input_target" placeholder="예: 100000000">
            <button class="btn-green" onclick="updateSettings()">데이터 적용</button>
        </div>

        <h3>테마 변경</h3>
        <div class="flex-row">
            <button class="btn-gray" onclick="setTheme('dark')" style="background:#333;">🌙 다크</button>
            <button class="btn-gray" onclick="setTheme('cute')" style="background:#ffb6c1;">🌸 귀엽게</button>
            <button class="btn-gray" onclick="setTheme('disguise')" style="background:#217346;">📊 엑셀위장</button>
        </div>
        
        <button class="btn-red" style="margin-top:30px; background:#888;" onclick="resetData()">데이터 전체 초기화</button>
    </div>

</div>

<!-- 하단 네비게이션 (위장 모드 시 엑셀 시트 탭으로 변함) -->
<div class="bottom-nav" id="bottom-nav">
    <div class="nav-item active" onclick="switchTab('main', this)">
        <span class="nav-icon emoji">🏠</span><span class="nav-text">홈(Sheet1)</span>
    </div>
    <div class="nav-item" onclick="switchTab('achievements', this)">
        <span class="nav-icon emoji">🏆</span><span class="nav-text">업적(Sheet2)</span>
    </div>
    <div class="nav-item" onclick="switchTab('settings', this)">
        <span class="nav-icon emoji">⚙️</span><span class="nav-text">설정(Sheet3)</span>
    </div>
</div>

<script>
    // --- 설정 데이터 ---
    const WORKING_SECONDS = 20 * 8 * 60 * 60; // 576,000초 (한달 실근무시간)
    let state = {
        total: 0.0, salary: 2110000, target: 100000000,
        unlockedAch: [], clickCount: 0, startTime: Date.now(),
        lastSaved: Date.now() / 1000, theme: 'dark'
    };
    let display_money = 0.0;
    let bps = 0.0;
    let lastFrameTime = performance.now();
    let uiHidden = false; // 몰입 모드 상태

    // --- DOM Elements ---
    const els = {
        money: document.getElementById('label_money'),
        bar: document.getElementById('progress_bar'),
        dday: document.getElementById('label_dday'),
        salInfo: document.getElementById('label_salary_info'),
        items: document.getElementById('label_items'),
        achList: document.getElementById('achievements-list'),
        achCount: document.getElementById('ach-count'),
        body: document.getElementById('body'),
        headerTitle: document.querySelector('.app-header')
    };

    function init() {
        loadData();
        renderAchievements();
        recalculateBPS();
        requestAnimationFrame(processLoop);
        setInterval(() => { saveData(); }, 3000); 
    }

    // --- 핵심 루프 ---
    function processLoop(currentTime) {
        let delta = (currentTime - lastFrameTime) / 1000.0;
        lastFrameTime = currentTime;

        // 실제 데이터 증가
        state.total += bps * delta;
        // 디스플레이 롤링 (보간법)
        display_money += (state.total - display_money) * (10.0 * delta);
        if (Math.abs(display_money - state.total) < 0.01) display_money = state.total;

        updateUI();
        requestAnimationFrame(processLoop);
    }

    function recalculateBPS() {
        bps = state.salary / WORKING_SECONDS;
        els.salInfo.innerHTML = `초당: ${bps.toFixed(2)}원 | 8h일당: ${formatMoneyNoDec(bps * 28800)}원`;
    }

    function updateUI() {
        // ★ 소수점 2자리 복구 (ex: 2,150,000.45)
        els.money.innerText = formatMoneyWithDec(display_money);
        
        let progress = Math.min((display_money / state.target) * 100, 100);
        els.bar.style.width = progress + "%";
        
        let remaining = state.target - state.total;
        if (remaining > 0 && bps > 0) {
            let s_left = remaining / bps;
            let d = Math.floor(s_left / 28800);
            let h = Math.floor((s_left % 28800) / 3600);
            let m = Math.floor((s_left % 3600) / 60);
            els.dday.innerText = `목표까지 근무일 기준 ${d}일 ${String(h).padStart(2,'0')}시간 남음`;
        } else {
            els.dday.innerText = "🎉 목표 달성 완료!";
        }

        // 아이템 업데이트
        let k = Math.floor(display_money/1300), g = Math.floor(display_money/10000), a = (display_money/33000000).toFixed(4);
        els.items.innerHTML = `<span class="emoji">🍙</span>김밥 ${k}개 | <span class="emoji">🍲</span>국밥 ${g}그릇<br><span class="emoji">🚗</span>아반떼 ${a}대`;
    }

    // --- UI 동작 ---
    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        btnElement.classList.add('active');
        
        // 탭 이동 시 UI 숨김 해제
        if(uiHidden) toggleUI();
    }

    // 화면 탭 시 UI(헤더, 탭바) 숨김/표시 (몰입 모드)
    function toggleUI() {
        uiHidden = !uiHidden;
        if(uiHidden) els.body.classList.add('ui-hidden');
        else els.body.classList.remove('ui-hidden');
    }

    // --- 설정 및 입출금 기능 ---
    function addMoney() {
        let val = parseFloat(document.getElementById('input_extra').value);
        if (val > 0) { state.total += val; state.clickCount++; unlockAch(15); document.getElementById('input_extra').value = ""; }
    }
    function spendMoney() {
        let val = parseFloat(document.getElementById('input_extra').value);
        if (val > 0 && state.total >= val) { state.total -= val; state.clickCount++; unlockAch(14); document.getElementById('input_extra').value = ""; }
    }
    function updateSettings() {
        let s = parseFloat(document.getElementById('input_salary').value);
        let t = parseFloat(document.getElementById('input_target').value);
        if (s > 0) state.salary = s;
        if (t > 0) state.target = t;
        recalculateBPS();
        alert("설정이 저장되었습니다.");
        switchTab('main', document.querySelector('.nav-item')); // 메인으로 돌아가기
    }
    function resetData() {
        if (confirm("정말 다 지우시겠습니까?")) { state.total = 0; display_money = 0; saveData(); switchTab('main', document.querySelector('.nav-item')); }
    }

    function setTheme(theme) {
        els.body.className = '';
        if(theme === 'cute') els.body.classList.add('theme-cute');
        if(theme === 'disguise') {
            els.body.classList.add('theme-disguise');
            els.headerTitle.innerText = "Data Sheet - Book1.xlsx";
        } else {
            els.headerTitle.innerHTML = '<span class="emoji">💸</span> 루팡 페이';
        }
        if(uiHidden) els.body.classList.add('ui-hidden');
        state.theme = theme;
        saveData();
    }

    // --- 숫자 포맷팅 ---
    function formatMoneyWithDec(val) {
        // 소수점 2자리와 콤마 부드럽게 표현
        let parts = val.toFixed(2).split('.');
        parts[0] = parseInt(parts[0]).toLocaleString('ko-KR');
        return parts.join('.');
    }
    function formatMoneyNoDec(val) {
        return Math.floor(val).toLocaleString('ko-KR');
    }

    // --- 업적 (기능 축소버전, 동작함) ---
    const achData = [
        {id:14, icon:"💸", title:"탕진잼", desc:"지출 기능 사용"},
        {id:15, icon:"🤑", title:"비자금", desc:"입금 기능 사용"}
    ];
    function renderAchievements() {
        els.achList.innerHTML = achData.map(a => `
            <div class="achievement-card ${state.unlockedAch.includes(a.id)?'unlocked':''}" id="ach-${a.id}">
                <div class="ach-icon emoji" style="font-size:2rem;">${a.icon}</div>
                <div><h4 style="margin:0 0 5px;">${a.title}</h4><p style="margin:0;font-size:0.8rem;">${a.desc}</p></div>
            </div>`).join('');
    }
    function unlockAch(id) {
        if(!state.unlockedAch.includes(id)) {
            state.unlockedAch.push(id);
            let ach = achData.find(a=>a.id===id);
            if(ach) showToast(`${ach.icon} [${ach.title}] 달성!`);
            renderAchievements();
            saveData();
        }
    }
    let tTime;
    function showToast(msg) {
        let t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('show');
        clearTimeout(tTime);
        tTime = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // --- 데이터 관리 ---
    function saveData() { state.lastSaved = Date.now()/1000; localStorage.setItem('lupin_final', JSON.stringify(state)); }
    function loadData() {
        let saved = localStorage.getItem('lupin_final');
        if (saved) {
            Object.assign(state, JSON.parse(saved));
            display_money = state.total;
            let elapsed = (Date.now()/1000) - state.lastSaved;
            if (elapsed > 0) state.total += (elapsed * (state.salary/WORKING_SECONDS));
            setTheme(state.theme);
        }
    }

    init();
</script>
</body>
</html>
