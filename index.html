<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월급루팡 대시보드</title>
    <style>
        /* --- 기본 리셋 및 트랜지션 --- */
        body { margin: 0; padding: 20px; display: flex; justify-content: center; transition: background 0.3s, color 0.3s; }
        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border 0.3s, box-shadow 0.3s; }
        
        .container { width: 100%; max-width: 650px; padding: 24px; margin-bottom: 50px; }
        .money-display { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        .progress-container { width: 100%; overflow: hidden; margin-bottom: 20px; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.1s linear; }
        .info-box { padding: 15px; margin-bottom: 16px; line-height: 1.6; }
        
        .control-group { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 16px; font-weight: bold; cursor: pointer; }
        
        /* 테마 선택기 */
        .theme-selector { display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end; }
        .theme-btn { padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer; }

        /* =========================================
           테마 1: 다크 모드 (기본, 세련된 느낌)
        ========================================= */
        body.theme-dark { background-color: #121212; color: #ffffff; font-family: 'Pretendard', sans-serif; }
        .theme-dark .container { background: #1e1e1e; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .theme-dark h1 { color: #aaaaaa; }
        .theme-dark .d-day { color: #ffd700; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; }
        .theme-dark .progress-container { height: 12px; background: #333; border-radius: 6px; }
        .theme-dark .progress-bar { background: #4caf50; }
        .theme-dark .info-box { background: #2a2a2a; border-radius: 8px; font-size: 0.9rem; }
        .theme-dark .tier-title { color: #88ccff; font-weight: bold; }
        .theme-dark input { border: 1px solid #444; background: #222; color: white; border-radius: 6px; }
        .theme-dark button { border: none; border-radius: 6px; }
        .theme-dark .btn-add { background: #4caf50; color: white; }
        .theme-dark .btn-spend { background: #f44336; color: white; }
        .theme-dark .btn-update { background: #2196f3; color: white; }
        .theme-dark .btn-reset { background: #555; color: white; width: 100%; margin-top: 10px; }

        /* =========================================
           테마 2: 아기자기 모드 (귀엽고 둥글둥글)
        ========================================= */
        body.theme-cute { background-color: #fff0f5; color: #555; font-family: 'Comic Sans MS', 'Pretendard', sans-serif; }
        .theme-cute .container { background: #ffffff; border-radius: 30px; border: 3px solid #ffb6c1; box-shadow: 0 10px 20px rgba(255,182,193,0.3); }
        .theme-cute h1 { color: #ff69b4; font-size: 1.4rem; text-align: center; }
        .theme-cute .money-display { color: #ff1493; text-align: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .theme-cute .d-day { color: #ff8c00; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .theme-cute .progress-container { height: 16px; background: #ffe4e1; border-radius: 20px; border: 1px solid #ffb6c1; }
        .theme-cute .progress-bar { background: linear-gradient(90deg, #ffb6c1, #ff69b4); border-radius: 20px; }
        .theme-cute .info-box { background: #fffafa; border: 2px dashed #ffb6c1; border-radius: 15px; }
        .theme-cute .tier-title { color: #dda0dd; font-weight: bold; }
        .theme-cute input { border: 2px solid #ffb6c1; background: #fff; color: #333; border-radius: 20px; padding: 10px 15px; }
        .theme-cute button { border: none; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .theme-cute .btn-add { background: #87ceeb; color: white; }
        .theme-cute .btn-spend { background: #ff9999; color: white; }
        .theme-cute .btn-update { background: #dda0dd; color: white; }
        .theme-cute .btn-reset { background: #ccc; color: white; width: 100%; margin-top: 10px; }

        /* =========================================
           테마 3: 위장(엑셀) 모드 (안 들키는 UI)
        ========================================= */
        body.theme-disguise { background-color: #f3f2f1; color: #000; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; padding: 0; display: block; }
        .theme-disguise .theme-selector { padding: 10px; background: #217346; margin: 0; }
        .theme-disguise .theme-btn { border-radius: 0; background: #f3f2f1; color: #000; border: 1px solid #ccc; }
        .theme-disguise .container { max-width: 100%; padding: 0; border: none; border-radius: 0; box-shadow: none; background: #fff; }
        .theme-disguise h1 { background: #f3f2f1; padding: 10px; margin: 0; font-size: 0.9rem; font-weight: normal; border-bottom: 1px solid #ccc; color: #333; }
        .theme-disguise .money-display { font-size: 1.2rem; font-family: Consolas, monospace; padding: 10px; margin: 0; border-bottom: 1px solid #ccc; }
        .theme-disguise .d-day { font-size: 0.9rem; color: #333; padding: 10px; margin: 0; border-bottom: 1px solid #ccc; font-weight: normal; }
        .theme-disguise .progress-container { height: 4px; background: #eee; border-radius: 0; margin: 0; }
        .theme-disguise .progress-bar { background: #217346; } /* 엑셀 초록색 */
        .theme-disguise .info-box { background: #fff; border-bottom: 1px solid #ccc; padding: 10px; border-radius: 0; margin: 0; font-size: 0.85rem; font-family: Consolas, monospace; }
        .theme-disguise .tier-title { color: #000; font-weight: normal; }
        .theme-disguise input { border: 1px solid #ccc; background: #fff; color: #000; border-radius: 0; padding: 5px; font-size: 0.9rem; }
        .theme-disguise button { border: 1px solid #ccc; border-radius: 0; background: #f3f2f1; color: #000; padding: 5px 10px; font-size: 0.9rem; font-weight: normal; box-shadow: none; }
        .theme-disguise .btn-add, .theme-disguise .btn-spend, .theme-disguise .btn-update, .theme-disguise .btn-reset { width: auto; margin: 0; }
        .theme-disguise .control-group { padding: 10px; border-bottom: 1px solid #ccc; margin: 0; background: #faf9f8; }
        /* 핵심: 위장 모드에서는 이모지 숨김 */
        .theme-disguise .emoji { display: none; }
        .theme-disguise .title-text::before { content: "Data Sheet 1 - "; }

    </style>
</head>
<body class="theme-dark" id="body">

<div class="theme-selector">
    <button class="theme-btn" onclick="setTheme('theme-dark')">🌙 다크</button>
    <button class="theme-btn" onclick="setTheme('theme-cute')">🌸 아기자기</button>
    <button class="theme-btn" onclick="setTheme('theme-disguise')">📊 업무위장</button>
</div>

<div class="container">
    <h1 class="title-text">통장 잔고 모니터링</h1>
    <div id="label_money" class="money-display">0.00 원</div>
    <div class="progress-container"><div id="progress_bar" class="progress-bar"></div></div>
    <div id="label_dday" class="d-day">목표까지: 계산 중...</div>

    <div class="info-box">
        <strong style="color:inherit;"><span class="emoji">💼</span> 실근무시간 기준 환산</strong><br>
        <span id="label_salary_info">초당: 0.00원 | 일당: 0원</span>
    </div>

    <div class="info-box" id="label_items">
        <!-- 리스트 렌더링 -->
    </div>

    <div class="control-group">
        <input type="number" id="input_extra" placeholder="금액 입력 (입금/지출)">
        <button class="btn-add" onclick="addMoney()">입금</button>
        <button class="btn-spend" onclick="spendMoney()">지출</button>
    </div>

    <div class="control-group">
        <input type="number" id="input_salary" placeholder="월급 갱신">
        <input type="number" id="input_target" placeholder="목표 금액 갱신">
        <button class="btn-update" onclick="updateSettings()">설정 적용</button>
    </div>

    <button class="btn-reset" onclick="resetData()">데이터 전체 초기화</button>
</div>

<script>
    // --- 마스터 데이터 ---
    // 기존(30일 24시간 = 2,592,000초) -> 개선(20일 8시간 = 576,000초)
    // 초당 오르는 속도가 약 4.5배 빨라짐 (도파민 증가!)
    const WORKING_SECONDS_IN_MONTH = 20 * 8 * 60 * 60; // 576,000초
    
    let target_money = 100000000.0; // 기본 1억
    let monthly_salary = 2110000.0;
    let total_accumulated = 0.0;
    let bps = 0.0;
    let display_money = 0.0;
    
    let lastFrameTime = performance.now();

    // --- DOM Elements ---
    const elBody = document.getElementById('body');
    const elMoney = document.getElementById('label_money');
    const elProgressBar = document.getElementById('progress_bar');
    const elDDay = document.getElementById('label_dday');
    const elSalaryInfo = document.getElementById('label_salary_info');
    const elItems = document.getElementById('label_items');
    const elInputExtra = document.getElementById('input_extra');
    const elInputSalary = document.getElementById('input_salary');
    const elInputTarget = document.getElementById('input_target');

    function init() {
        loadData();
        recalculateBPS();
        requestAnimationFrame(processLoop);
        setInterval(saveData, 5000);
        window.addEventListener('beforeunload', saveData);
    }

    function setTheme(themeName) {
        elBody.className = themeName;
        localStorage.setItem('lupin_theme', themeName);
        updateUI(); // 이모지 렌더링 갱신용
    }

    // --- 메인 루프 ---
    function processLoop(currentTime) {
        let delta = (currentTime - lastFrameTime) / 1000.0;
        lastFrameTime = currentTime;

        total_accumulated += bps * delta;
        display_money += (total_accumulated - display_money) * (10.0 * delta);

        if (Math.abs(display_money - total_accumulated) < 0.1) {
            display_money = total_accumulated;
        }

        updateUI();
        requestAnimationFrame(processLoop);
    }

    // --- 핵심 로직 ---
    function recalculateBPS() {
        bps = monthly_salary / WORKING_SECONDS_IN_MONTH;
        let daily_wage = bps * (8 * 60 * 60); // 8시간 기준 일당
        elSalaryInfo.innerHTML = `초당: ${bps.toFixed(2)}원 | 일당(8h): ${formatMoney(daily_wage)}원`;
    }

    function updateUI() {
        elMoney.innerText = formatMoney(display_money) + " 원";
        
        let progressPercent = Math.min((display_money / target_money) * 100, 100);
        elProgressBar.style.width = progressPercent + "%";

        // 카운트다운
        let remaining = target_money - total_accumulated;
        if (remaining > 0) {
            if (bps > 0) {
                // 남은 시간 = 남은금액 / 초당수익
                // 여기서는 남은 일수를 8시간(근무시간) 기준으로 환산해서 보여줌
                let seconds_left = remaining / bps;
                let d = Math.floor(seconds_left / (8 * 3600)); 
                let h = Math.floor((seconds_left % (8 * 3600)) / 3600);
                let m = Math.floor((seconds_left % 3600) / 60);
                let s = Math.floor(seconds_left % 60);
                
                elDDay.innerText = `목표까지: 근무일 기준 ${d}일 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} 남음`;
            }
        } else {
            elDDay.innerText = "목표 금액 달성 완료!";
        }

        // 아이템 리스트 렌더링
        let kimbap = Math.floor(display_money / 1300);
        let gukbab = Math.floor(display_money / 10000);
        let chicken = Math.floor(display_money / 28000);
        let phone = (display_money / 1300000.0).toFixed(2);
        let avante = (display_money / 33000000.0).toFixed(4);
        let seoul = (display_money / 1650000000.0).toFixed(6);

        let htmlItems = `
            <span class="tier-title">[ 생활비 ]</span> <span class="emoji">🍙</span>김밥: ${kimbap}개 | <span class="emoji">🍲</span>국밥: ${gukbab}그릇 | <span class="emoji">🍗</span>치킨: ${chicken}마리<br>
            <span class="tier-title">[ 전자기기 ]</span> <span class="emoji">📱</span>스마트폰: ${phone}대<br>
            <span class="tier-title">[ 모빌리티 ]</span> <span class="emoji">🚗</span>아반떼: ${avante}대<br>
            <span class="tier-title">[ 부 동 산 ]</span> <span class="emoji">🏢</span>서울APT: ${seoul}채
        `;
        elItems.innerHTML = htmlItems;
    }

    // --- 버튼 이벤트 ---
    function addMoney() {
        let val = parseFloat(elInputExtra.value);
        if (val > 0) {
            total_accumulated += val;
            elInputExtra.value = "";
            saveData();
        }
    }

    function spendMoney() {
        let val = parseFloat(elInputExtra.value);
        if (val > 0 && total_accumulated >= val) {
            total_accumulated -= val;
            elInputExtra.value = "";
            saveData();
        }
    }

    function updateSettings() {
        let sal = parseFloat(elInputSalary.value);
        let tgt = parseFloat(elInputTarget.value);
        
        if (sal > 0) monthly_salary = sal;
        if (tgt > 0) target_money = tgt;
        
        recalculateBPS();
        elInputSalary.value = "";
        elInputTarget.value = "";
        saveData();
    }

    function resetData() {
        if (confirm("정말 잔고를 0원으로 초기화하시겠습니까? (설정은 유지됩니다)")) {
            total_accumulated = 0.0;
            display_money = 0.0;
            saveData();
        }
    }

    // --- 데이터 관리 ---
    function saveData() {
        const data = {
            total: total_accumulated,
            salary: monthly_salary,
            target: target_money,
            timestamp: Date.now() / 1000
        };
        localStorage.setItem('lupin_v2', JSON.stringify(data));
    }

    function loadData() {
        const savedTheme = localStorage.getItem('lupin_theme');
        if (savedTheme) elBody.className = savedTheme;

        const saved = localStorage.getItem('lupin_v2');
        if (saved) {
            const data = JSON.parse(saved);
            total_accumulated = data.total || 0;
            monthly_salary = data.salary || 2110000;
            target_money = data.target || 100000000;
            display_money = total_accumulated; 
            
            recalculateBPS();
            
            let lastTime = data.timestamp;
            let elapsed = (Date.now() / 1000) - lastTime;
            
            // 오프라인 방치 수익 계산 (근무시간 BPS 적용)
            if (elapsed > 0) {
                total_accumulated += (elapsed * bps);
            }
        }
    }

    function formatMoney(val) {
        return val.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    init();
</script>
</body>
</html>
